  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

in visual value. */\n  --color-neutral-100: #f9f4ed;\n  --color-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components \n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral r-neutral-100);font-size:clamp(20px,3vw,28px);font-weight:800;color:var(--color-accent-700);text-align:center;word-break:break-word;line-height:1.4\">{{ q.display }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ q.hasSpecies }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:24px;background:var(--color-neutral-100);width:fit-content;max-width:100%\">\n            <span style=\"min-width:64px;height:64px;padding:0 12px;border-radius:32px;background:var(--color-accent);color:var(--color-bg);display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:26px\">{{ q.species.label }}<\u002Fspan>\n            <div style=\"display:flex;flex-direction:column\">\n              <span style=\"font-weight:700;font-size:16px\">{{ q.species.name }} · Z = {{ q.species.z }}<\u002Fspan>\n              <span style=\"font-size:14px;color:var(--color-neutral-700)\">Electrones totales: {{ q.species.electrons }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ q.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"margin:0;font-size:13px;color:var(--color-neutral-700);text-wrap:pretty\">{{ q.note }}<\u002Fp>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isChoice }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n            <sc-for list=\"{{ choices }}\" as=\"c\" hint-placeholder-count=\"2\">\n              <button class=\"btn\" style=\"flex:1 1 {{ c.basis }};padding:14px 20px;font-size:16px;background:{{ c.bg }};color:{{ c.fg }};border-color:{{ c.border }}\" disabled=\"{{ answered }}\" sc-camel-on-click=\"{{ c.onClick }}\">{{ c.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isDetect }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px\">\n            <div class=\"field\"><label>n (principal)<\u002Flabel>\n              <sc-raw-select class=\"input\" style=\"cursor:pointer;font-weight:700\" value=\"{{ inp.n }}\" disabled=\"{{ answered }}\" sc-camel-on-change=\"{{ onInpN }}\">\n                <sc-for list=\"{{ nOpts }}\" as=\"o\" hint-placeholder-count=\"1\"><option value=\"{{ o.v }}\">{{ o.t }}<\u002Foption><\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <div class=\"field\"><label>l (secundario)<\u002Flabel>\n              <sc-raw-select class=\"input\" style=\"cursor:pointer;font-weight:700\" value=\"{{ inp.l }}\" disabled=\"{{ answered }}\" sc-camel-on-change=\"{{ onInpL }}\">\n                <sc-for list=\"{{ lOpts }}\" as=\"o\" hint-placeholder-count=\"1\"><option value=\"{{ o.v }}\">{{ o.t }}<\u002Foption><\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <div class=\"field\"><label>mₗ (magnético)<\u002Flabel>\n              <sc-raw-select class=\"input\" style=\"cursor:pointer;font-weight:700\" value=\"{{ inp.ml }}\" disabled=\"{{ answered }}\" sc-camel-on-change=\"{{ onInpMl }}\">\n                <sc-for list=\"{{ mlOpts }}\" as=\"o\" hint-placeholder-count=\"1\"><option value=\"{{ o.v }}\">{{ o.t }}<\u002Foption><\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <div class=\"field\"><label>mₛ (espín)<\u002Flabel>\n              <sc-raw-select class=\"input\" style=\"cursor:pointer;font-weight:700\" value=\"{{ inp.ms }}\" disabled=\"{{ answered }}\" sc-camel-on-change=\"{{ onInpMs }}\">\n                <sc-for list=\"{{ msOpts }}\" as=\"o\" hint-placeholder-count=\"1\"><option value=\"{{ o.v }}\">{{ o.t }}<\u002Foption><\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <\u002Fdiv>\n            <button class=\"btn btn-primary\" style=\"padding:14px 20px;font-size:16px\" disabled=\"{{ answered }}\" sc-camel-on-click=\"{{ onAnsInp }}\">Comprobar números cuánticos<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isLocate }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px\">\n            <div class=\"field\"><label>Periodo<\u002Flabel>\n              <sc-raw-select class=\"input\" style=\"cursor:pointer;font-weight:700\" value=\"{{ inp.per }}\" disabled=\"{{ answered }}\" sc-camel-on-change=\"{{ onInpPer }}\">\n                <sc-for list=\"{{ perOpts }}\" as=\"o\" hint-placeholder-count=\"1\"><option value=\"{{ o.v }}\">{{ o.t }}<\u002Foption><\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <div class=\"field\"><label>Grupo<\u002Flabel>\n              <sc-raw-select class=\"input\" style=\"cursor:pointer;font-weight:700\" value=\"{{ inp.grp }}\" disabled=\"{{ answered }}\" sc-camel-on-change=\"{{ onInpGrp }}\">\n                <sc-for list=\"{{ grpOpts }}\" as=\"o\" hint-placeholder-count=\"1\"><option value=\"{{ o.v }}\">{{ o.t }}<\u002Foption><\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <div class=\"field\"><label>Bloque<\u002Flabel>\n              <sc-raw-select class=\"input\" style=\"cursor:pointer;font-weight:700\" value=\"{{ inp.blk }}\" disabled=\"{{ answered }}\" sc-camel-on-change=\"{{ onInpBlk }}\">\n                <sc-for list=\"{{ blkOpts }}\" as=\"o\" hint-placeholder-count=\"1\"><option value=\"{{ o.v }}\">{{ o.t }}<\u002Foption><\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <\u002Fdiv>\n            <button class=\"btn btn-primary\" style=\"padding:14px 20px;font-size:16px\" disabled=\"{{ answered }}\" sc-camel-on-click=\"{{ onAnsInp }}\">Comprobar posición<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isText }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n            <input class=\"input\" type=\"text\" placeholder=\"p. ej. 1s2 2s2 2p6 3s1\" style=\"flex:1 1 280px;width:auto;min-height:50px;font-size:18px;font-weight:600\" value=\"{{ inp.text }}\" disabled=\"{{ answered }}\" sc-camel-on-change=\"{{ onInpText }}\" sc-camel-on-key-down=\"{{ onKeySubmit }}\">\n            <button class=\"btn btn-primary\" style=\"padding:12px 24px;font-size:16px\" disabled=\"{{ answered }}\" sc-camel-on-click=\"{{ onAnsInp }}\">Comprobar<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isNumber }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n            <input class=\"input\" type=\"number\" min=\"0\" placeholder=\"Nº de electrones\" style=\"flex:0 1 220px;width:auto;min-height:50px;font-size:20px;font-weight:700;text-align:center\" value=\"{{ inp.num }}\" disabled=\"{{ answered }}\" sc-camel-on-change=\"{{ onInpNum }}\" sc-camel-on-key-down=\"{{ onKeySubmit }}\">\n            <button class=\"btn btn-primary\" style=\"padding:12px 24px;font-size:16px\" disabled=\"{{ answered }}\" sc-camel-on-click=\"{{ onAnsInp }}\">Comprobar<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasErr }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"margin:0;font-size:14px;font-weight:600;color:var(--color-accent-800)\">{{ inpErr }}<\u002Fp>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasFb }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:20px 22px;border-radius:26px;background:{{ fb.bg }};color:{{ fb.fg }};display:flex;flex-direction:column;gap:10px\">\n            <h4 style=\"margin:0\">{{ fb.title }}<\u002Fh4>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;text-wrap:pretty\">{{ fb.reason }}<\u002Fp>\n            <button class=\"btn\" style=\"width:fit-content;background:var(--color-neutral-900);color:var(--color-neutral-100)\" sc-camel-on-click=\"{{ onNext }}\">\n              {{ nextLabel }}<svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" style=\"stroke-width:2.75;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m12 5 7 7-7 7\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ examDone }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"card\" style=\"padding:32px;gap:22px;box-shadow:var(--shadow-md)\">\n        <span class=\"card-kicker\" style=\"color:var(--color-accent-700);font-weight:700\">Resultado del examen<\u002Fspan>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:24px\">\n          <div style=\"width:150px;height:150px;border-radius:50%;background:var(--color-accent);color:var(--color-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;box-shadow:var(--shadow-md)\">\n            <span style=\"font-family:var(--font-heading);font-size:60px;line-height:1\">{{ examRes.grade }}<\u002Fspan>\n            <span style=\"font-size:14px;font-weight:600\">sobre 10<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;max-width:520px\">\n            <h2 style=\"margin:0\">{{ examRes.label }}<\u002Fh2>\n            <p style=\"margin:0;font-size:16px;color:var(--color-neutral-700)\">{{ examRes.summary }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;max-width:560px\">\n          <sc-for list=\"{{ examRes.rows }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-radius:999px;background:var(--color-neutral-100);font-size:15px\">\n              <span>{{ r.label }}<\u002Fspan><span style=\"font-weight:700\">{{ r.val }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button class=\"btn btn-primary\" style=\"width:fit-content;padding:12px 24px;font-size:16px\" sc-camel-on-click=\"{{ onRestartExam }}\">Repetir examen<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isTheory }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:22px\">\n    <div style=\"display:flex;flex-direction:column;gap:6px;max-width:680px\">\n      <h2 style=\"margin:0\">Principios y reglas fundamentales<\u002Fh2>\n      <p style=\"margin:0;font-size:16px;color:var(--color-neutral-700)\">Las leyes que rigen la estructura electrónica de los átomos.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px\">\n      <div class=\"card\" style=\"padding:24px;gap:10px\">\n        <span class=\"tag tag-accent\" style=\"width:fit-content;font-weight:700\">1 · Principio de Aufbau<\u002Fspan>\n        <span class=\"card-title\" style=\"font-size:20px\">Mínima energía<\u002Fspan>\n        <p style=\"margin:0;font-size:14px;line-height:1.6;color:var(--color-neutral-800)\">Los electrones ocupan los orbitales en orden creciente de energía. Se llena antes el subnivel con menor valor de n + l; si dos subniveles tienen el mismo n + l, se llena antes el de menor n.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"padding:24px;gap:10px\">\n        <span class=\"tag tag-accent-2\" style=\"width:fit-content;font-weight:700\">2 · Principio de Pauli<\u002Fspan>\n        <span class=\"card-title\" style=\"font-size:20px\">Exclusión<\u002Fspan>\n        <p style=\"margin:0;font-size:14px;line-height:1.6;color:var(--color-neutral-800)\">Dos electrones de un mismo átomo no pueden tener sus cuatro números cuánticos iguales. En un orbital caben como máximo 2 electrones con espines opuestos (↑↓).<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"padding:24px;gap:10px\">\n        <span class=\"tag tag-neutral\" style=\"width:fit-content;font-weight:700\">3 · Regla de Hund<\u002Fspan>\n        <span class=\"card-title\" style=\"font-size:20px\">Máxima multiplicidad<\u002Fspan>\n        <p style=\"margin:0;font-size:14px;line-height:1.6;color:var(--color-neutral-800)\">En subniveles degenerados (p, d, f), los electrones ocupan el mayor número posible de orbitales con espines paralelos (↑) antes de aparearse.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px\">\n      <div class=\"card\" style=\"padding:24px;gap:14px\">\n        <h3 style=\"margin:0\">Los números cuánticos<\u002Fh3>\n        <div style=\"overflow-x:auto\">\n          <sc-raw-table class=\"table\" style=\"min-width:420px\">\n            <sc-raw-thead><sc-raw-tr><sc-raw-th>Número<\u002Fsc-raw-th><sc-raw-th>Valores permitidos<\u002Fsc-raw-th><sc-raw-th>Qué indica<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-raw-tr><sc-raw-td><strong>n<\u002Fstrong> · principal<\u002Fsc-raw-td><sc-raw-td>1, 2, 3, …<\u002Fsc-raw-td><sc-raw-td>Nivel de energía y tamaño del orbital<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td><strong>l<\u002Fstrong> · secundario<\u002Fsc-raw-td><sc-raw-td>0, 1, …, n − 1<\u002Fsc-raw-td><sc-raw-td>Forma del orbital: 0 = s, 1 = p, 2 = d, 3 = f<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td><strong>mₗ<\u002Fstrong> · magnético<\u002Fsc-raw-td><sc-raw-td>−l, …, 0, …, +l<\u002Fsc-raw-td><sc-raw-td>Orientación espacial del orbital<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td><strong>mₛ<\u002Fstrong> · espín<\u002Fsc-raw-td><sc-raw-td>+1/2, −1/2<\u002Fsc-raw-td><sc-raw-td>Sentido de giro del electrón<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"padding:24px;gap:14px\">\n        <h3 style=\"margin:0\">Capacidad de niveles y subniveles<\u002Fh3>\n        <div style=\"overflow-x:auto\">\n          <sc-raw-table class=\"table\" style=\"min-width:380px\">\n            <sc-raw-thead><sc-raw-tr><sc-raw-th>n<\u002Fsc-raw-th><sc-raw-th>Subniveles<\u002Fsc-raw-th><sc-raw-th>Orbitales (n²)<\u002Fsc-raw-th><sc-raw-th>Electrones (2n²)<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-raw-tr><sc-raw-td>1<\u002Fsc-raw-td><sc-raw-td>1s<\u002Fsc-raw-td><sc-raw-td>1<\u002Fsc-raw-td><sc-raw-td>2<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td>2<\u002Fsc-raw-td><sc-raw-td>2s 2p<\u002Fsc-raw-td><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td>8<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td>3<\u002Fsc-raw-td><sc-raw-td>3s 3p 3d<\u002Fsc-raw-td><sc-raw-td>9<\u002Fsc-raw-td><sc-raw-td>18<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td>4s 4p 4d 4f<\u002Fsc-raw-td><sc-raw-td>16<\u002Fsc-raw-td><sc-raw-td>32<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:14px;color:var(--color-neutral-800)\">Cada subnivel tiene 2l + 1 orbitales y admite 2(2l + 1) electrones:<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n          <span class=\"tag\" style=\"background:var(--color-accent-2-600);color:var(--color-neutral-100);font-size:13px;font-weight:700\">s · 1 orbital · 2 e⁻<\u002Fspan>\n          <span class=\"tag\" style=\"background:var(--color-accent-500);color:var(--color-neutral-100);font-size:13px;font-weight:700\">p · 3 orbitales · 6 e⁻<\u002Fspan>\n          <span class=\"tag\" style=\"background:var(--color-accent-800);color:var(--color-neutral-100);font-size:13px;font-weight:700\">d · 5 orbitales · 10 e⁻<\u002Fspan>\n          <span class=\"tag\" style=\"background:var(--color-accent-2-800);color:var(--color-neutral-100);font-size:13px;font-weight:700\">f · 7 orbitales · 14 e⁻<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\" style=\"padding:24px;gap:18px\">\n      <div style=\"display:flex;flex-direction:column;gap:4px;max-width:720px\">\n        <h3 style=\"margin:0\">Diagrama de Moeller: orden de llenado<\u002Fh3>\n        <p style=\"margin:0;font-size:14px;color:var(--color-neutral-700);text-wrap:pretty\">El número de cada subnivel indica su turno de llenado. Regla: menor n + l primero; a igual n + l, menor n primero.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start\">\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ moellerRows }}\" as=\"row\" hint-placeholder-count=\"7\">\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <span style=\"width:48px;font-size:13px;font-weight:700;color:var(--color-neutral-700)\">n = {{ row.n }}<\u002Fspan>\n              <sc-for list=\"{{ row.cells }}\" as=\"cell\" hint-placeholder-count=\"2\">\n                <span style=\"width:66px;display:flex;align-items:center;justify-content:space-between;gap:4px;padding:5px 6px 5px 12px;border-radius:999px;background:{{ cell.color }};color:var(--color-neutral-100);font-weight:700;font-size:14px\">{{ cell.label }}<span style=\"width:22px;height:22px;border-radius:50%;background:var(--color-neutral-100);color:var(--color-text);display:flex;align-items:center;justify-content:center;font-size:11px\">{{ cell.order }}<\u002Fspan><\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"flex:1 1 320px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start\">\n          <sc-for list=\"{{ moellerSeq }}\" as=\"sq\" hint-placeholder-count=\"19\">\n            <span style=\"display:flex;flex-direction:column;align-items:center;padding:6px 10px;border-radius:18px;background:var(--color-neutral-100);min-width:52px\">\n              <span style=\"font-weight:800;font-size:15px;color:{{ sq.color }}\">{{ sq.label }}<\u002Fspan>\n              <span style=\"font-size:11px;color:var(--color-neutral-700)\">n + l = {{ sq.nl }}<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\" style=\"padding:24px;gap:14px\">\n      <h3 style=\"margin:0\">Configuración de iones<\u002Fh3>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px\">\n        <div style=\"padding:16px 18px;border-radius:22px;background:var(--color-accent-100);color:var(--color-accent-900);display:flex;flex-direction:column;gap:4px\">\n          <span style=\"font-weight:700\">Cationes: se quitan electrones<\u002Fspan>\n          <span style=\"font-size:14px;line-height:1.55\">Se pierden primero los electrones del nivel n más alto, no los últimos que entraron. Por eso los metales de transición pierden antes los 4s que los 3d: Fe²⁺ es [Ar] 3d⁶, no [Ar] 4s² 3d⁴.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:16px 18px;border-radius:22px;background:var(--color-accent-2-100);color:var(--color-accent-2-900);display:flex;flex-direction:column;gap:4px\">\n          <span style=\"font-weight:700\">Aniones: se añaden electrones<\u002Fspan>\n          <span style=\"font-size:14px;line-height:1.55\">Los electrones extra entran siguiendo el orden de Aufbau, normalmente hasta completar la configuración del gas noble siguiente.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"overflow-x:auto\">\n        <sc-raw-table class=\"table\" style=\"min-width:420px\">\n          <sc-raw-thead><sc-raw-tr><sc-raw-th>Especie<\u002Fsc-raw-th><sc-raw-th>Electrones<\u002Fsc-raw-th><sc-raw-th>Configuración<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ ionRows }}\" as=\"ir\" hint-placeholder-count=\"8\">\n              <sc-raw-tr><sc-raw-td style=\"font-weight:700\">{{ ir.species }}<\u002Fsc-raw-td><sc-raw-td>{{ ir.electrons }}<\u002Fsc-raw-td><sc-raw-td>{{ ir.config }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\" style=\"padding:24px;gap:14px\">\n      <div style=\"display:flex;flex-direction:column;gap:4px\">\n        <h3 style=\"margin:0\">Anomalías de estabilidad<\u002Fh3>\n        <p style=\"margin:0;font-size:14px;color:var(--color-neutral-700)\">Las 12 excepciones que recoge el explorador. Las más habituales en 2º de Bachillerato son Cr y Cu.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"overflow-x:auto\">\n        <sc-raw-table class=\"table\" style=\"min-width:720px\">\n          <sc-raw-thead><sc-raw-tr><sc-raw-th>Elemento<\u002Fsc-raw-th><sc-raw-th>Z<\u002Fsc-raw-th><sc-raw-th>Teórica (Moeller)<\u002Fsc-raw-th><sc-raw-th>Real (experimental)<\u002Fsc-raw-th><sc-raw-th>Causa<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ anomRows }}\" as=\"ar\" hint-placeholder-count=\"12\">\n              <sc-raw-tr><sc-raw-td style=\"font-weight:700\">{{ ar.name }}<\u002Fsc-raw-td><sc-raw-td>{{ ar.z }}<\u002Fsc-raw-td><sc-raw-td>{{ ar.ideal }}<\u002Fsc-raw-td><sc-raw-td style=\"font-weight:700;color:var(--color-accent-2-700)\">{{ ar.real }}<\u002Fsc-raw-td><sc-raw-td>{{ ar.cause }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px\">\n      <div style=\"padding:24px;border-radius:32px;background:var(--color-accent-2-900);color:var(--color-neutral-100);display:flex;flex-direction:column;gap:12px\">\n        <h3 style=\"margin:0;color:var(--color-accent-2-200)\">Convenio del simulador<\u002Fh3>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:var(--color-accent-2-100)\">Los orbitales de un subnivel se ocupan de mₗ = −l a mₗ = +l, y el primer electrón de cada orbital tiene mₛ = +1/2 (↑).<\u002Fp>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:var(--color-accent-2-100)\">Ejemplo, 2p⁴: los tres primeros electrones van a mₗ = −1, 0, +1 con ↑; el cuarto se aparea en mₗ = −1 con ↓. Su combinación es (2, 1, −1, −1/2).<\u002Fp>\n        <p style=\"margin:0;font-size:13px;color:var(--color-accent-2-300)\">Algunos libros empiezan por +l o por −1/2: el razonamiento es el mismo, solo cambia el convenio.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"padding:24px;gap:12px\">\n        <h3 style=\"margin:0\">Errores frecuentes en exámenes<\u002Fh3>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ mistakes }}\" as=\"m\" hint-placeholder-count=\"7\">\n            <div style=\"display:flex;gap:10px;align-items:flex-start\">\n              <span style=\"width:24px;height:24px;border-radius:50%;background:var(--color-accent-200);color:var(--color-accent-800);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none\">{{ m.n }}<\u002Fspan>\n              <span style=\"font-size:14px;line-height:1.55;text-wrap:pretty\">{{ m.t }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fmain>\n\n<footer style=\"width:100%;max-width:1200px;margin:0 auto;padding:24px 24px 36px;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--color-neutral-700)\">\n  \n  <p style=\"margin: 0; text-align: right\">Simulador Cuántico<\u002Fp><p style=\"margin: 0; text-align: right\">Bachillerato - Química <br>Desarrollado por Profesor Iván PB-IA<\u002Fp>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  static ANOM = {\n    24: [{ '4s': 1, '3d': 5 }, 'Anomalía d⁵: [Ar] 4s¹ 3d⁵ por estabilidad de subnivel semilleno.', 'Subnivel 3d semilleno (d⁵)'],\n    29: [{ '4s': 1, '3d': 10 }, 'Anomalía d¹⁰: [Ar] 4s¹ 3d¹⁰ por estabilidad de subnivel lleno.', 'Subnivel 3d lleno (d¹⁰)'],\n    41: [{ '5s': 1, '4d': 4 }, 'Anomalía d⁴: [Kr] 5s¹ 4d⁴.', 'Energías 5s y 4d muy próximas'],\n    42: [{ '5s': 1, '4d': 5 }, 'Anomalía d⁵: [Kr] 5s¹ 4d⁵ por estabilidad de subnivel semilleno.', 'Subnivel 4d semilleno (d⁵)'],\n    44: [{ '5s': 1, '4d': 7 }, 'Anomalía d⁷: [Kr] 5s¹ 4d⁷.', 'Energías 5s y 4d muy próximas'],\n    45: [{ '5s': 1, '4d': 8 }, 'Anomalía d⁸: [Kr] 5s¹ 4d⁸.', 'Energías 5s y 4d muy próximas'],\n    46: [{ '5s': 0, '4d': 10 }, 'Anomalía d¹⁰: [Kr] 5s⁰ 4d¹⁰ por máxima simetría orbital.', 'Subnivel 4d lleno; 5s queda vacío'],\n    47: [{ '5s': 1, '4d': 10 }, 'Anomalía d¹⁰: [Kr] 5s¹ 4d¹⁰ por estabilidad de subnivel lleno.', 'Subnivel 4d lleno (d¹⁰)'],\n    57: [{ '4f': 0, '5d': 1 }, 'Entrada del subnivel 5d antes del 4f: [Xe] 6s² 5d¹.', 'El 5d se ocupa antes que el 4f'],\n    64: [{ '4f': 7, '5d': 1 }, 'Anomalía f⁷: [Xe] 6s² 4f⁷ 5d¹.', 'Subnivel 4f semilleno (f⁷)'],\n    78: [{ '6s': 1, '5d': 9 }, 'Anomalía d⁹: [Xe] 6s¹ 4f¹⁴ 5d⁹.', 'Energías 6s y 5d muy próximas'],\n    79: [{ '6s': 1, '5d': 10 }, 'Anomalía d¹⁰: [Xe] 6s¹ 4f¹⁴ 5d¹⁰.', 'Subnivel 5d lleno (d¹⁰)']\n  };\n  static MOELLER =     ring: x.label === cur ? '0 0 0 3px var(--color-text)' : c && !full ? `inset 0 0 0 2px ${COL[x.type]}` : 'none' }; }) })),\n      moellerCaption: s.filling ? (cur ? `Llenando: el electrón ${visible.length} entra en el subnivel ${cur}.` : 'Preparando el llenado…')\n        : `Cada casilla indica electrones / capacidad. El contorno oscuro marca el subnivel del ${s.charge ? 'último electrón' : 'electrón diferenciador'} (${diff.sub}).`,\n\n      isBuild: s.tab === 'build',\n      isCompare: s.tab === 'compare', ...(s.tab === 'compare' ? this.cmpData(COL) : { cmpCols: [], cmpNotes: [], cmpPresets: [] }),\n      bTarget: { label: bsp.label, name: bsp.name, z: bsp.z, electrons: bsp.electrons, desc: 'este ' + bsp.kind },\n      bSelect: bd.charge ? '' : String(bd.z),\n      bOptions: C.ELEMENTS.slice(0, 36).map(e => ({ z: e.z, label: `${e.z} · ${e.name} (${e.symbol})` })),\n      onBuildSelect: ev => { const v = parseInt(ev.target.value); if (v) this.setState({ build: this.newBuild(v) }); },\n      onBuildNew: () => this.setState({ build: this.newBuild() }),\n      onBuildClear: () => this.setState(st => ({ build: { ...st.build, boxes: {}, result: null, sol: false } })),\n      onBuildSolution: () => this.buildSolution(),\n      onBuildCheck: () => this.buildCheck(),\n      bSubs, bPlaced: bSubs.reduce((a, x) => a + x.count, 0), bNeeded: bd.z - bd.charge,\n      bSolShown: bd.sol, hasBResult: !!br,\n      bRes: br ? { title: br.all ? '¡Configuración correcta!' : 'Revisa estos puntos',\n        bg: br.all ? 'var(--color-accent-2-100)' : 'var(--color-accent-100)', fg: br.all ? 'var(--color-accent-2-900)' : 'var(--color-accent-900)',\n        checks: br.checks.map(c => ({ label: c.label, msg: c.msg, icon: c.ok ? '✓' : '✗', ibg: c.ok ? 'var(--color-accent-2-600)' : 'var(--color-accent-600)' })),\n        hasNote: !!br.note, note: br.note } : { checks: [] },\n\n      score: s.score,\n      pct: s.score.t ? Math.round(s.score.c / s.score.t * 100) + '%' : '–',\n      onResetScore: () => this.setState({ score: { c: 0, t: 0, s: 0 } }),\n      onNewQ: () => this.newQ(), onNext: () => this.newQ(),\n      notExam: !ex,\n      typeCards: C.TYPES.map(([id, kicker, title, body]) => ({\n        kicker, title, body,\n        bg: s.ptype === id ? 'var(--color-accent-100)' : 'var(--color-surface)',\n        border: s.ptype === id ? 'var(--color-accent)' : 'transparent',\n        onClick: () => this.setType(id)\n      })),\n      showQuestion: !!s.q && !(ex && ex.done), examDone: !!(ex && ex.done),\n      qTag: ex ? `Pregunta ${Math.min(10, ex.i + (fb ? 0 : 1))} de 10 · ${typeName(q.type)}` : 'Enunciado',\n      q,\n      isChoice: q.mode === 'choice', isDetect: q.mode === 'detect', isLocate: q.mode === 'locate', isText: q.mode === 'text', isNumber: q.mode === 'number',\n      choices: (q.choices || []).map(c => { const t = TONE[c.tone]; return { label: c.label, bg: t[0], fg: t[1], border: t[2], basis: c.basis || '200px', onClick: () => this.answer(c.value) }; }),\n      answered: !!fb,\n      onAnsInp: () => this.answer(s.inp),\n      onKeySubmit: ev => { if (ev.key === 'Enter') this.answer(this.state.inp); },\n      inp: s.inp, inpErr: s.inpErr, hasErr: !!s.inpErr,\n      nOpts: opts([1, 2, 3, 4, 5, 6, 7]),\n      lOpts: [0, 1, 2, 3].map(v => ({ v: String(v), t: `${v} (subnivel ${'spdf'[v]})` })),\n      mlOpts: [-3, -2, -1, 0, 1, 2, 3].map(v => ({ v: String(v), t: this.sgn(v) })),\n      msOpts: [{ v: '0.5', t: '+1/2 (↑)' }, { v: '-0.5', t: '−1/2 (↓)' }],\n      perOpts: opts([1, 2, 3, 4, 5, 6, 7]),\n      grpOpts: opts(Array.from({ length: 18 }, (_, i) => i + 1)),\n      blkOpts: ['s', 'p', 'd', 'f'].map(v => ({ v, t: 'Bloque ' + v })),\n      onInpN: ev => this.setInp('n', ev.target.value), onInpL: ev => this.setInp('l', ev.target.value),\n      onInpMl: ev => this.setInp('ml', ev.target.value), onInpMs: ev => this.setInp('ms', ev.target.value),\n      onInpPer: ev => this.setInp('per', ev.target.value), onInpGrp: ev => this.setInp('grp', ev.targ
